<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Dive: Execução de Frameworks</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --primary: #2d3436;
            --accent: #0984e3;
            --code-bg: #1e1e1e;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        .container { display: flex; gap: 40px; max-width: 1200px; width: 100%; flex-wrap: wrap; justify-content: center; }

        /* Smartphone e Camadas */
        .phone {
            width: 300px;
            height: 600px;
            background: #111;
            border-radius: 40px;
            padding: 15px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .screen {
            background: #fff;
            height: 100%;
            border-radius: 30px;
            display: flex;
            flex-direction: column-reverse;
            padding: 10px;
            gap: 5px;
            position: relative;
            overflow: hidden;
        }

        .layer {
            height: 55px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            z-index: 2;
            transition: 0.3s;
            position: relative;
        }

        /* Signal/Data Animation */
        .signal {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 15px #fff;
            display: none;
        }

        @keyframes flowDown {
            0% { bottom: 85%; opacity: 1; }
            100% { bottom: 5%; opacity: 1; }
        }

        /* Painel Lateral */
        .side-panel { flex: 1; min-width: 400px; }

        .framework-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .fw-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .fw-card:hover { transform: translateY(-3px); }
        .fw-card.active { border-color: var(--accent); background: #f0f7ff; }
        .fw-card h4 { margin: 0; font-size: 14px; }
        .fw-card span { font-size: 11px; color: #636e72; }

        .execution-log {
            background: var(--code-bg);
            color: #dcdcdc;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            min-height: 250px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .log-entry { margin-bottom: 8px; border-left: 3px solid #555; padding-left: 10px; opacity: 0; transform: translateX(-10px); animation: fadeInLog 0.4s forwards; }
        @keyframes fadeInLog { to { opacity: 1; transform: translateX(0); } }

        .highlight { color: #51ff00; font-weight: bold; }
        .tech-tag { background: #444; padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        /* Estilo das Camadas */
        .c-hw { background: #2d3436; }
        .c-gfx { background: #d63031; } /* Motor Gráfico */
        .c-os { background: #636e72; }
        .c-api { background: #e67e22; }
        .c-engine { background: #0984e3; }
        .c-app { background: #00b894; }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 5px;">Como o Código vira Pixel?</h1>
    <p style="margin-bottom: 30px; color: #636e72;">Clique em um framework para simular a renderização de um botão</p>

    <div class="container">
        <!-- Celular -->
        <div class="phone">
            <div id="signal" class="signal"></div>
            <div class="screen" id="layers-container">
                <!-- Camadas injetadas aqui -->
            </div>
        </div>

        <!-- Explicação -->
        <div class="side-panel">
            <div class="framework-selector">
                <div class="fw-card" onclick="simulate('native', event)">
                    <h4>Swift / Kotlin</h4>
                    <span>Nativo Puro</span>
                </div>
                <div class="fw-card" onclick="simulate('flutter', event)">
                    <h4>Flutter</h4>
                    <span>Engine Própria</span>
                </div>
                <div class="fw-card" onclick="simulate('react', event)">
                    <h4>React Native</h4>
                    <span>Bridge / JSI</span>
                </div>
                <div class="fw-card" onclick="simulate('pwa', event)">
                    <h4>PWA / Web</h4>
                    <span>Browser Engine</span>
                </div>
            </div>

            <div class="execution-log" id="log">
                <div style="color: #888;">// Aguardando interação...<br>// O fluxo de execução aparecerá aqui.</div>
            </div>
        </div>
    </div>

    <script>
        const configs = {
            native: {
                layers: [
                    { n: "GPU / Display", c: "c-hw" },
                    { n: "SurfaceFlinger / Compositor", c: "c-os" },
                    { n: "Skia / Core Graphics", c: "c-gfx" },
                    { n: "OEM Widgets (Botão Android/iOS)", c: "c-api" },
                    { n: "Código Nativo (Linguagem)", c: "c-app" }
                ],
                steps: [
                    "Instância: O app chama um <span class='highlight'>UIButton/android.widget.Button</span>.",
                    "API: O sistema operacional recebe a requisição de desenho.",
                    "Render: O motor <span class='highlight'>Skia (Android)</span> ou <span class='highlight'>Core Graphics (iOS)</span> calcula os vetores.",
                    "Composição: O <span class='highlight'>SurfaceFlinger</span> compõe a camada do app com o restante da tela.",
                    "Hardware: Envio de buffers para a GPU."
                ]
            },
            flutter: {
                layers: [
                    { n: "GPU / Display", c: "c-hw" },
                    { n: "SurfaceFlinger / Compositor", c: "c-os" },
                    { n: "Flutter Engine (Skia/Impeller)", c: "c-gfx" },
                    { n: "Framework (Dart Widgets)", c: "c-engine" },
                    { n: "App (Dart)", c: "c-app" }
                ],
                steps: [
                    "Dart: O código define um <span class='highlight'>ElevatedButton()</span>.",
                    "Widget: Flutter não usa botões do sistema; ele desenha cada pixel sozinho.",
                    "Engine: A engine <span class='highlight'>Skia/Impeller</span> é acionada diretamente pelo Dart via C++.",
                    "Direct Draw: O Flutter ignora as APIs de UI do Android/iOS.",
                    "Display: O resultado é enviado ao <span class='highlight'>SurfaceFlinger</span> como uma textura única."
                ]
            },
            react: {
                layers: [
                    { n: "GPU / Display", c: "c-hw" },
                    { n: "SurfaceFlinger", c: "c-os" },
                    { n: "Skia / Core Graphics", c: "c-gfx" },
                    { n: "Native Modules / Bridge", c: "c-engine" },
                    { n: "JavaScript / Yoga", c: "c-app" }
                ],
                steps: [
                    "JS: O componente <span class='highlight'>&lt;Button /&gt;</span> é processado no motor Hermes/V8.",
                    "Layout: O motor <span class='highlight'>Yoga</span> calcula as posições (Flexbox) no lado JS.",
                    "Bridge: Uma mensagem JSON (ou via JSI) diz ao lado Nativo: 'Crie um botão aqui'.",
                    "Native: O sistema cria um widget OEM (igual ao Nativo puro).",
                    "Render: Segue o fluxo nativo via Skia e SurfaceFlinger."
                ]
            },
            pwa: {
                layers: [
                    { n: "GPU / Display", c: "c-hw" },
                    { n: "Compositor do Browser", c: "c-os" },
                    { n: "Blink / WebKit (Render)", c: "c-gfx" },
                    { n: "DOM / CSSOM", c: "c-engine" },
                    { n: "Web App (HTML/JS)", c: "c-app" }
                ],
                steps: [
                    "HTML: O navegador lê a tag <span class='highlight'>&lt;button&gt;</span>.",
                    "DOM: Criação da árvore de objetos e estilos CSS.",
                    "Layout: O motor <span class='highlight'>Blink (Chrome)</span> calcula a geometria.",
                    "Paint: Os pixels são pintados no motor do navegador.",
                    "GPU: O navegador pede ao S.O. para exibir o frame renderizado."
                ]
            }
        };

        function simulate(type, evt) {
            const config = configs[type];
            const container = document.getElementById('layers-container');
            const log = document.getElementById('log');
            const signal = document.getElementById('signal');

            // UI Feedback
            document.querySelectorAll('.fw-card').forEach(c => c.classList.remove('active'));
            evt.currentTarget.classList.add('active');

            // Reset e Desenha Camadas
            container.innerHTML = '';
            config.layers.forEach(l => {
                const div = document.createElement('div');
                div.className = `layer ${l.c}`;
                div.innerHTML = l.n;
                container.appendChild(div);
            });

            // Inicia Log
            log.innerHTML = '';
            
            // Animação da Partícula
            signal.style.display = 'block';
            signal.style.animation = 'none';
            signal.offsetHeight; // trigger reflow
            signal.style.animation = 'flowDown 2s linear';

            // Logs sequenciais com timing
            config.steps.forEach((step, i) => {
                setTimeout(() => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.innerHTML = `<span style="color: #888;">[0${i+1}]</span> ${step}`;
                    log.appendChild(entry);
                    log.scrollTop = log.scrollHeight;
                }, i * 400);
            });

            setTimeout(() => { signal.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
